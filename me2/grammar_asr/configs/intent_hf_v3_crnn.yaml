# Intent v3 — IntentCRNN = exact v1 clone + surgical OOS/real knobs only.
# No SpecAug. Goal: keep real ~70% while cutting FAR vs v1 (38%).
tag: intent_hf_v3_crnn
version: v3
experiment: intent_crnn_hf
notes: >
  Surgical delta on intent_hf_v1: misfire=0.15, real_weight=1.5, oos_weight=1.5,
  select_real_weight=0.3, SpecAug off. Same arch/lr/batch/WD/LS as v1.
parent: intent_hf_v1
seed: 1
device: cuda
epochs: 80
batch_size: 128
num_workers: 4
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 5
max_seconds: 5.0
char_reward: 0.15
target_far: 0.10
amp: true
decode_prefer: intent_head
select_real_weight: 0.3

model:
  name: intent
  gru_hidden: 96
  gru_layers: 2
  dropout: 0.15

data:
  root: null
  use_hf: true
  require_local: false
  include_negatives: true
  include_fil: false
  include_synth_extra: false
  include_numerals: false
  val_fraction: 0.1
  revision: null
  real_weight: 1.5
  oos_weight: 1.5
  augment: false

loss:
  ctc_weight: 0.0
  intent_weight: 1.0
  slot_weight: 1.0
  confusable_weight: 0.1
  label_smoothing: 0.05
  misfire_weight: 0.15
