# Intent v2b — MatchboxNet + same mild recipe as v2b CRNN (fair rematch).
tag: intent_hf_v2b_matchbox
version: v2b
experiment: intent_matchbox_hf
notes: >
  MatchboxNet M with the mild v2b recipe (not the failed heavy v2). Same
  knobs as intent_hf_v2b_crnn. Tests whether Matchbox beats CRNN when the
  recipe is not over-regularized.
parent: intent_hf_v2_matchbox
seed: 0
device: cuda
epochs: 80
batch_size: 128
num_workers: 4
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 5
max_seconds: 5.0
char_reward: 0.15
target_far: 0.10
amp: true
decode_prefer: intent_head
select_real_weight: 0.5

model:
  name: matchbox
  width: 104
  blocks: 4
  repeat: 2
  dropout: 0.1

data:
  root: null
  use_hf: true
  require_local: false
  include_negatives: true
  include_fil: false
  include_synth_extra: false
  include_numerals: false
  val_fraction: 0.1
  revision: null
  real_weight: 2.5
  oos_weight: 2.0
  augment: light

loss:
  ctc_weight: 0.0
  intent_weight: 1.0
  slot_weight: 1.0
  confusable_weight: 0.1
  label_smoothing: 0.05
  misfire_weight: 0.35
