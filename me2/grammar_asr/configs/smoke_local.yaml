# Offline smoke using the synthetic fixture under me2/data/gold
tag: smoke_local
seed: 0
device: cpu
smoke: true
smoke_n: 48
epochs: 1
batch_size: 8
num_workers: 0
lr: 0.001
max_seconds: 2.0
target_far: 0.5
amp: false

model:
  name: kiwi
  gru_hidden: 32
  gru_layers: 1
  dropout: 0.1

data:
  root: data/gold
  use_hf: false
  require_local: true
  include_negatives: false
  include_fil: false
  val_fraction: 0.25

loss:
  ctc_weight: 0.0
  intent_weight: 1.0
  slot_weight: 1.0
  confusable_weight: 0.0
  label_smoothing: 0.0
