# Intent v2 — same IntentCRNN arch as v1, but with the improved vcm-me2 recipe.
# Isolates recipe gains vs architecture change.
tag: intent_hf_v2_crnn
version: v2
experiment: intent_crnn_hf
notes: >
  IntentCRNN (BiGRU96x2) with v2 recipe only: real_weight=5, SpecAug,
  misfire_weight=1, select_real_weight=0.5, lr=3e-3. Ablation vs
  intent_hf_v2_conformer / matchbox.
parent: intent_hf_v1
seed: 1
device: cuda
epochs: 60
batch_size: 64
num_workers: 4
lr: 0.003
weight_decay: 0.01
warmup_epochs: 2
max_seconds: 5.0
char_reward: 0.15
target_far: 0.10
amp: true
decode_prefer: intent_head
select_real_weight: 0.5

model:
  name: intent
  gru_hidden: 96
  gru_layers: 2
  dropout: 0.15

data:
  root: null
  use_hf: true
  require_local: false
  include_negatives: true
  include_fil: false
  include_synth_extra: false
  include_numerals: false
  val_fraction: 0.1
  revision: null
  real_weight: 5.0
  oos_weight: 3.0
  augment: true

loss:
  ctc_weight: 0.0
  intent_weight: 1.0
  slot_weight: 1.0
  confusable_weight: 0.1
  label_smoothing: 0.1
  misfire_weight: 1.0
