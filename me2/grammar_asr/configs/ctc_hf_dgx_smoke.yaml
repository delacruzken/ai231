# End-to-end CTC + grammar smoke test against the DGX Hugging Face cache.
tag: ctc_hf_dgx_smoke
seed: 0
device: cuda
smoke: true
smoke_n: 96
epochs: 2
batch_size: 32
num_workers: 4
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 0
max_seconds: 5.0
char_reward: 0.15
target_far: 0.10
# Match the full run: CTC is kept in FP32 to avoid skipped optimizer steps.
amp: false
decode_prefer: grammar

model:
  name: ctc_low
  hidden: 192
  num_blocks: 5
  dropout: 0.1

data:
  root: null
  use_hf: true
  require_local: false
  include_negatives: true
  include_fil: false
  include_synth_extra: false
  include_numerals: false
  val_fraction: 0.1
  revision: null

loss:
  ctc_weight: 1.0
  intent_weight: 0.0
  slot_weight: 0.0
  confusable_weight: 0.0
  label_smoothing: 0.0
