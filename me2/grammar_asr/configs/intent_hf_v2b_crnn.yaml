# Intent v2b — IntentCRNN + mild recipe (fix for failed heavy v2).
# Keep v1 arch/lr/batch; add light SpecAug, mild real/OOS reweight,
# light misfire, and select on 0.5*all+0.5*real.
tag: intent_hf_v2b_crnn
version: v2b
experiment: intent_crnn_hf
notes: >
  IntentCRNN same as v1, milder recipe than failed v2: lr=1e-3, batch 128,
  light SpecAug (p=0.35), real_weight=2.5, oos_weight=2.0, misfire=0.35,
  select_real_weight=0.5. Goal: beat v1 real cmd (~70%) and cut FAR.
parent: intent_hf_v1
seed: 1
device: cuda
epochs: 80
batch_size: 128
num_workers: 4
lr: 0.001
weight_decay: 0.0001
warmup_epochs: 5
max_seconds: 5.0
char_reward: 0.15
target_far: 0.10
amp: true
decode_prefer: intent_head
select_real_weight: 0.5

model:
  name: intent
  gru_hidden: 96
  gru_layers: 2
  dropout: 0.15

data:
  root: null
  use_hf: true
  require_local: false
  include_negatives: true
  include_fil: false
  include_synth_extra: false
  include_numerals: false
  val_fraction: 0.1
  revision: null
  real_weight: 2.5
  oos_weight: 2.0
  augment: light

loss:
  ctc_weight: 0.0
  intent_weight: 1.0
  slot_weight: 1.0
  confusable_weight: 0.1
  label_smoothing: 0.05
  misfire_weight: 0.35
