          <rect id="scene-night" x="0" y="0" width="1280" height="720" fill="#000" />
        </svg>

        <div class="eink-grain" aria-hidden="true"></div>

        <div id="listen-pill" class="notice-bubble" hidden>
          <span aria-hidden="true">!</span>
          <span class="sr-only">Listening</span>
        </div>

        <div id="msg-bubble" class="letter" hidden>
          <span class="letter-stamp" aria-hidden="true">✉</span>
          <div>
            <p class="letter-from">A letter arrived!</p>
            <p id="msg-text">New message for you!</p>
          </div>
        </div>

        <div class="pockets" aria-label="Active timers and alarms">
          <div id="timer-chip" class="pocket" hidden>
            <span class="pocket-icon" aria-hidden="true">⏳</span>
            <span id="timer-text">timer —</span>
          </div>
          <div id="alarm-chip" class="pocket" hidden>
            <span class="pocket-icon" aria-hidden="true">⏰</span>
            <span id="alarm-text">alarm —</span>
          </div>
        </div>

        <div class="dialogue-wrap">
          <div class="dialogue">
            <span class="speaker-tag">Kaki</span>
            <p id="caption" class="caption" aria-live="polite"></p>
            <span class="continue" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <p class="voice-hint"><span>R</span> Say “Kaki” then a command</p>
    </main>
    <div class="eink-home" aria-hidden="true"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
