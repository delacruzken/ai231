[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "me3-voice-agent"
version = "0.1.0"
description = "ME3 full-duplex voice agent (Pipecat + local speech + MCP tools)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Provisional pins from architecture plan §3; validate against releases before Phase 1.
  "pipecat-ai[websocket]==1.15.0",
  "mcp>=1.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
speech = [
  # Pins verified during Phase 1 install; bump only with a patch note.
  "sherpa-onnx==2.0.1",
  "piper-tts==1.8.0",
  "onnxruntime>=1.17.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.0",
  "psutil>=5.9.0",
  "websockets>=13.0",
  "sounddevice>=0.5.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "anthropic>=0.40.0",
]

[project.scripts]
me3-agent = "me3.app.main:main"
me3-asr = "me3.mcp.asr.server:main"
me3-tts = "me3.mcp.tts.server:main"
me3-speech-runner = "me3.speech.runner:main"
me3-device-check = "me3.speech.device_check:main"
me3-sample-bank = "me3.conversation.sample_bank:main"
me3-publication-sample = "me3.publication.sample_bank:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
